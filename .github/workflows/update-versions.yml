name: update-versions

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "software.json"

permissions:
  contents: write

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Résoudre les dernières versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq empty software.json
          echo '{}' > versions.json
          jq -c '.[] | select(.github) | {repo: .github, pre: (.prerelease // false)}' software.json | sort -u | while read -r row; do
            repo=$(jq -r .repo <<<"$row")
            pre=$(jq -r .pre <<<"$row")
            if [ "$pre" = "true" ]; then
              rel=$(gh api "repos/$repo/releases?per_page=1" --jq '.[0]' 2>/dev/null || echo '{}')
            else
              rel=$(gh api "repos/$repo/releases/latest" 2>/dev/null || echo '{}')
            fi
            [ -z "$rel" ] && rel='{}'
            jq --arg r "$repo" --argjson rel "$rel" \
              '.[$r] = {
                 tag: ($rel.tag_name // null),
                 url: ($rel.html_url // null),
                 date: ($rel.published_at // null),
                 assets: [($rel.assets // [])[] | {name: .name, url: .browser_download_url}]
               }' versions.json > tmp.json
            mv tmp.json versions.json
          done
          jq --arg d "$(date -u +%F)" '._updated = $d' versions.json > tmp.json
          mv tmp.json versions.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "maj versions"
            git push
          fi
